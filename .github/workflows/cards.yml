name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cards.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THEME: bg_color=00000000&title_color=8B5CF6&icon_color=8B5CF6&text_color=8B949E&border_color=30363D
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=adib-11&show_icons=true&hide_rank=true&hide=stars&show=prs_merged&include_all_commits=true&custom_title=GitHub%20Activity&card_width=420&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=adib-11&layout=donut&langs_count=6&hide=html,css,shell,dockerfile,jq&card_width=380&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card issue-solver
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=adib-11&repo=issue-solver&description_lines_count=3&${{ env.THEME }}
          path: profile/pin-issue-solver.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card qdna
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=adib-11&repo=qdna&description_lines_count=3&${{ env.THEME }}
          path: profile/pin-qdna.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card stepcheck
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=adib-11&repo=stepcheck&description_lines_count=3&${{ env.THEME }}
          path: profile/pin-stepcheck.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin card GuardRail-Finance
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=adib-11&repo=GuardRail-Finance&description_lines_count=3&${{ env.THEME }}
          path: profile/pin-guardrail-finance.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: adib-11
          outputs: |
            profile/snake.svg?color_snake=#8B5CF6
            profile/snake-dark.svg?palette=github-dark&color_snake=#8B5CF6

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update README cards" || exit 0
          git push
